name: Android APKs (manual)

# Intentionally NOT on push/PR — needs NDK; must not gate desktop cargo CI.
on:
  workflow_dispatch:

jobs:
  assemble:
    name: native + mobile + tv debug APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | sdkmanager --install "ndk;27.0.12077973" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Build native libs
        run: ./android/scripts/build-native.sh

      - name: Assemble debug APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleMobileDebug :app:assembleTvDebug

      - name: Stage dist names
        run: |
          mkdir -p android/dist
          cp android/app/build/outputs/apk/tv/debug/app-tv-debug.apk \
            android/dist/channelcast-tv-debug.apk
          cp android/app/build/outputs/apk/mobile/debug/app-mobile-debug.apk \
            android/dist/channelcast-mobile-debug.apk
          ls -lh android/dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: channelcast-android-apks
          path: |
            android/dist/channelcast-tv-debug.apk
            android/dist/channelcast-mobile-debug.apk
          if-no-files-found: error
