name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create/publish (e.g. v0.1.1). Leave empty to build artifacts only without a GitHub Release."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI build deps (egui/winit)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev pkg-config
      - name: cargo test
        run: cargo test --workspace

  build:
    name: Build ${{ matrix.asset_stem }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- CLI ---
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: channelcast-cli
            bin: channelcast
            asset_stem: channelcast-cli-linux-x64
            archive: tar.gz
            needs_gui_deps: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package: channelcast-cli
            bin: channelcast
            asset_stem: channelcast-cli-windows-x64
            archive: zip
            needs_gui_deps: false
          - os: macos-latest
            target: x86_64-apple-darwin
            package: channelcast-cli
            bin: channelcast
            asset_stem: channelcast-cli-macos-x64
            archive: tar.gz
            needs_gui_deps: false
          - os: macos-latest
            target: aarch64-apple-darwin
            package: channelcast-cli
            bin: channelcast
            asset_stem: channelcast-cli-macos-arm64
            archive: tar.gz
            needs_gui_deps: false
          # --- Desktop (egui/eframe) ---
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: channelcast-desktop
            bin: channelcast-desktop
            asset_stem: channelcast-desktop-linux-x64
            archive: tar.gz
            needs_gui_deps: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package: channelcast-desktop
            bin: channelcast-desktop
            asset_stem: channelcast-desktop-windows-x64
            archive: zip
            needs_gui_deps: false
          - os: macos-latest
            target: x86_64-apple-darwin
            package: channelcast-desktop
            bin: channelcast-desktop
            asset_stem: channelcast-desktop-macos-x64
            archive: tar.gz
            needs_gui_deps: false
          - os: macos-latest
            target: aarch64-apple-darwin
            package: channelcast-desktop
            bin: channelcast-desktop
            asset_stem: channelcast-desktop-macos-arm64
            archive: tar.gz
            needs_gui_deps: false

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GUI build deps (egui/winit)
        if: matrix.needs_gui_deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev pkg-config

      - name: Build release binary
        run: cargo build -p ${{ matrix.package }} --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          OUT="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          STAGE="${{ matrix.asset_stem }}"
          mkdir -p "$STAGE"
          cp "$OUT" "$STAGE/${{ matrix.bin }}"
          cp README.md LICENSE channels.toml "$STAGE/"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "target/${{ matrix.target }}/release/${{ matrix.bin }}.exe"
          $stage = "${{ matrix.asset_stem }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $out "$stage/${{ matrix.bin }}.exe"
          Copy-Item README.md, LICENSE, channels.toml $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force
          "ASSET=$stage.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_stem }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp -v {} release-assets/ \;
          ls -la release-assets

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ChannelCast ${{ steps.tag.outputs.name }}
          draft: false
          generate_release_notes: true
          body: |
            ## CLI downloads

            | Platform | Asset |
            |----------|-------|
            | Windows x64 | `channelcast-cli-windows-x64.zip` |
            | Linux x64 | `channelcast-cli-linux-x64.tar.gz` |
            | macOS Intel x64 | `channelcast-cli-macos-x64.tar.gz` |
            | macOS Apple Silicon | `channelcast-cli-macos-arm64.tar.gz` |

            Unpack and run the `channelcast` binary (`channelcast.exe` on Windows).

            ## Desktop GUI downloads

            egui/eframe shell — channel list + headlines, opens articles in your browser.

            | Platform | Asset |
            |----------|-------|
            | Windows x64 | `channelcast-desktop-windows-x64.zip` |
            | Linux x64 | `channelcast-desktop-linux-x64.tar.gz` |
            | macOS Intel x64 | `channelcast-desktop-macos-x64.tar.gz` |
            | macOS Apple Silicon | `channelcast-desktop-macos-arm64.tar.gz` |

            Unpack and run `channelcast-desktop` (`channelcast-desktop.exe` on Windows). Linux needs a display and typical X11/Wayland libraries (`libxcb`, `libxkbcommon`).

            ## Android (debug APKs)

            Sideload from this release when attached (built on a machine with NDK; not produced by this workflow):

            | Device | Asset | Package |
            |--------|-------|---------|
            | Phone (S25 Ultra) | `channelcast-mobile-debug.apk` | `com.cruiseliner.channelcast.debug` |
            | Android TV | `channelcast-tv-debug.apk` | `com.cruiseliner.channelcast.tv.debug` |

            Phone: Material 3 chips/cards, Custom Tabs. TV: leanback focus UI + in-app WebView.

            Build from source:
            ```
            cargo install --path crates/channelcast-cli
            cargo run -p channelcast-desktop
            ```
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
