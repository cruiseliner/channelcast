name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create/publish (e.g. v0.1.0). Leave empty to build artifacts only without a GitHub Release."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: channelcast

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --workspace

  build:
    name: Build ${{ matrix.asset_stem }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_stem: channelcast-cli-linux-x64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_stem: channelcast-cli-windows-x64
            archive: zip
          # Both Mac targets on macos-latest (arm64 host). x86_64 is a
          # first-class Apple target — no macos-13 queue dependency.
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_stem: channelcast-cli-macos-x64
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_stem: channelcast-cli-macos-arm64
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build -p channelcast-cli --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          OUT="target/${{ matrix.target }}/release/${BIN_NAME}"
          STAGE="${{ matrix.asset_stem }}"
          mkdir -p "$STAGE"
          cp "$OUT" "$STAGE/${BIN_NAME}"
          cp README.md LICENSE channels.toml "$STAGE/"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "target/${{ matrix.target }}/release/$env:BIN_NAME.exe"
          $stage = "${{ matrix.asset_stem }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $out "$stage/$env:BIN_NAME.exe"
          Copy-Item README.md, LICENSE, channels.toml $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force
          "ASSET=$stage.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_stem }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp -v {} release-assets/ \;
          ls -la release-assets

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ChannelCast ${{ steps.tag.outputs.name }}
          draft: false
          generate_release_notes: true
          body: |
            ## CLI downloads

            | Platform | Asset |
            |----------|-------|
            | Windows x64 | `channelcast-cli-windows-x64.zip` |
            | Linux x64 | `channelcast-cli-linux-x64.tar.gz` |
            | macOS Intel x64 | `channelcast-cli-macos-x64.tar.gz` |
            | macOS Apple Silicon | `channelcast-cli-macos-arm64.tar.gz` |

            Unpack and run the `channelcast` binary (`channelcast.exe` on Windows).

            **Android APK:** not available yet (planned; UniFFI/JNI shell around `channelcast-core`).

            Build from source: `cargo install --path crates/channelcast-cli`
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
