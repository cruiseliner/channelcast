[package]
name = "channelcast-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "UniFFI bridge exposing channelcast-core to Kotlin/Android"
publish = false

[lib]
name = "channelcast_ffi"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
bindgen = ["uniffi/cli"]

[dependencies]
channelcast-core.workspace = true
thiserror.workspace = true
uniffi = "0.29"

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }
