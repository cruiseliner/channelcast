# ChannelCast v0.1 default channels.
# Every feed URL below returned HTTP 200 when committed (2026-10-24).
# Edit freely; stub channels document next steps and have no feeds yet.
#
# Personal / optional channels: set enabled = false to hide from default
# CLI listing unless --all. Public repo does not endorse any outlet's views.
# Gannett HTML/sitemap (Florida Today, USA Today): polite UA, cookie optional, never commit secrets.

[[channels]]
id = "top"
name = "Top Stories"
description = "World / US national headlines. Free RSS + personal USA Today nation/politics HTML/sitemap (cookie optional)."
feeds = [
  "https://feeds.bbci.co.uk/news/world/rss.xml",
  "https://feeds.npr.org/1001/rss.xml",
  # Personal USA Today (Gannett): section listing + news-sitemap nation/politics filter. Not RSS.
  # Cookie optional (CHANNELCAST_USATODAY_COOKIE or .channelcast/usatoday.cookies).
  "https://www.usatoday.com/news/nation/",
  "https://www.usatoday.com/news-sitemap.xml#nation",
]

# Weather / local keyed to ZIP 32920 (Cape Canaveral / Cocoa Beach, Brevard County, FL).
# Geocode: 28.3903,-80.6043 → NWS office MLB grid 56,65; forecast zone FLZ747; county FLC009.
# Points: https://api.weather.gov/points/28.3903,-80.6043 (HTTP 200, 2026-10-24)

[[channels]]
id = "weather"
name = "Weather"
description = "Live NWS MLB dashboard for ZIP 32920 (Cape Canaveral): Now/hourly/3-day + active graphicast hazards; NHC tropical when Atlantic-relevant. Phone/TV use fetch_weather(); feeds below are CLI/fallback only."
enabled = true
personal = true
feeds = [
  # Active alerts (Atom) — dated; Android Weather tab uses the live dashboard instead
  "https://api.weather.gov/alerts/active.atom?zone=FLZ747",
]
# Dashboard (Android): api.weather.gov grid MLB/56,65 forecast + hourly, stations/obs,
# graphicast https://www.weather.gov/source/mlb/graphicast/graphicast.xml, NHC CurrentStorms.json
[[channels]]
id = "local"
name = "Local"
description = "Brevard / Space Coast community news for ZIP 32920 (Cape Canaveral area). Free RSS + personal Florida Today /space/ HTML (cookie optional)."
enabled = true
personal = true
feeds = [
  "https://spacecoastdaily.com/feed/",
  # Personal subscriber HTML listing (not RSS). Cookie optional — titles without auth.
  "https://www.floridatoday.com/space/",
]
# Industry / KSC launch coverage also in `spacecoast`.
# Tried / dropped (2026-10-24): Florida Today RSS 404; Orlando Sentinel 403;
# Brevard Times 403; ClickOrlando / WESH Arc RSS → HTML; Space Coast Live 404.
# Florida Today: use listing HTML + optional Cookie (see README). Never commit cookies.

[[channels]]
id = "spacecoast"
name = "Space Coast"
description = "NASA / KSC, SpaceX, Blue Origin, Merritt Island — items that expand or impact Kennedy Space Center. Free RSS + personal Florida Today space HTML/sitemap (cookie optional)."
enabled = true
personal = true
feeds = [
  "https://blogs.nasa.gov/kennedy/feed/",
  "https://blogs.nasa.gov/artemis/feed/",
  "https://spaceflightnow.com/feed/",
  "https://www.nasaspaceflight.com/feed/",
  "https://spacenews.com/feed/",
  "https://nasawatch.com/feed/",
  # Personal Florida Today: section listing + news-sitemap (space-path filter). Not RSS.
  # Cookie optional (CHANNELCAST_FLORIDATODAY_COOKIE or .channelcast/floridatoday.cookies).
  "https://www.floridatoday.com/space/",
  "https://www.floridatoday.com/news-sitemap.xml#space",
]
# Also verified 200: nasa.gov/rss/dyn/breaking_news.rss, space.com/feeds/news
# Dropped: blogs.nasa.gov/commercialcrew/feed/ (200 HTML); Blue Origin / SpaceX official RSS (no usable feed);
# Florida Today RSS paths 404 — HTML/sitemap path added instead (personal subscriber use).
# Optional tighter filter — edit freely:
keywords = [
  "kennedy",
  "ksc",
  "merritt island",
  "cape canaveral",
  "spacex",
  "blue origin",
  "falcon",
  "starship",
  "dragon",
  "artemis",
